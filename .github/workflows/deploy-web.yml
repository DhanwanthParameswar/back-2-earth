# Build the Web export and put it live on https://back2earth.pp.ua.
# Runs on every push to main (and by hand from the Actions tab). Same steps as
# tools/deploy_web.sh: export with the pinned Godot, gzip the wasm, upload over
# SSH, swap the new build in so visitors never see half of one.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY       private key for the server (the OCI .key file)
#   DEPLOY_HOST          server address
#   DEPLOY_USER          SSH user (ubuntu)
#   DEPLOY_KNOWN_HOSTS   the server's public host keys (ssh-keyscan output)
name: Deploy web build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "art_source/**"
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Godot + only the web template we need (the full template pack is 1.3 GB),
      # downloaded once and cached.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Install Godot (first run only)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's direct release links time out (504) from Actions, so fetch from
          # Godot's own download mirror, falling back to the GitHub API.
          fetch() {  # fetch <file name> <mirror slug> <mirror platform> <out>
            local mirror="https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=$2&platform=$3"
            curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -o "$4" "$mirror" && return 0
            local asset
            asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/godotengine/godot-builds/releases/tags/${GODOT_VERSION}-stable" \
              | jq -r --arg n "$1" '.assets[] | select(.name == $n) | .url')
            curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" -o "$4" "$asset"
          }
          mkdir -p ~/godot
          fetch "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" linux.x86_64.zip linux.64 /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          fetch "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" export_templates.tpz templates /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$tdir"
          rm -f /tmp/templates.tpz /tmp/godot.zip
          ls -l "$tdir"

      - name: Export web build
        run: |
          ~/godot/godot --headless --path . --import
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck && test -s build/web/index.wasm
          cp web/favicon.ico build/web/favicon.ico
          # The ~40 MB wasm shrinks to ~10 MB; Caddy serves the .gz to browsers that accept it.
          gzip -9 -k -f build/web/index.wasm
          ls -l build/web

      - name: Upload and swap in
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          for v in SSH_KEY KNOWN_HOSTS HOST USER_NAME; do
            [ -n "${!v}" ] || { echo "Missing repository secret for $v (see the top of this file)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C build/web -czf - . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST" '
            set -e
            sudo rm -rf /var/www/back2earth.new
            sudo install -d -m 755 /var/www/back2earth.new
            sudo tar -xzf - -C /var/www/back2earth.new --no-same-owner
            sudo rm -rf /var/www/back2earth.old
            [ -d /var/www/back2earth ] && sudo mv /var/www/back2earth /var/www/back2earth.old
            sudo mv /var/www/back2earth.new /var/www/back2earth
            ls -l /var/www/back2earth'
          rm -f ~/.ssh/deploy_key

      - name: Check the site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://back2earth.pp.ua/)
          echo "https://back2earth.pp.ua/ -> $code"
          [ "$code" = 200 ]
