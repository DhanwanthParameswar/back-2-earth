# Build the Web export and put it live on https://back2earth.pp.ua.
# Runs on every push to main (and by hand from the Actions tab). Same steps as
# tools/deploy_web.sh: export with the pinned Godot, gzip the wasm, upload over
# SSH, swap the new build in so visitors never see half of one.
#
# The build runs in barichello/godot-ci (Godot + export templates preinstalled);
# keep its tag equal to the project's Godot version.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY       private key for the server (the OCI .key file)
#   DEPLOY_HOST          server address
#   DEPLOY_USER          SSH user (ubuntu)
#   DEPLOY_KNOWN_HOSTS   the server's public host keys (ssh-keyscan output)
name: Deploy web build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "art_source/**"
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued or running one.
concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      # The image keeps its templates under /root; Actions runs with a different HOME.
      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            ln -s /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
              ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | grep web

      - name: Export web build
        run: |
          godot --headless --path . --import
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck && test -s build/web/index.wasm
          cp web/favicon.ico build/web/favicon.ico
          # The ~40 MB wasm shrinks to ~10 MB; Caddy serves the .gz to browsers that accept it.
          gzip -9 -k -f build/web/index.wasm
          ls -l build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Upload and swap in
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          for v in SSH_KEY KNOWN_HOSTS HOST USER_NAME; do
            [ -n "${!v}" ] || { echo "Missing repository secret for $v (see the top of this file)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C build/web -czf - . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST" '
            set -e
            sudo rm -rf /var/www/back2earth.new
            sudo install -d -m 755 /var/www/back2earth.new
            sudo tar -xzf - -C /var/www/back2earth.new --no-same-owner
            sudo rm -rf /var/www/back2earth.old
            [ -d /var/www/back2earth ] && sudo mv /var/www/back2earth /var/www/back2earth.old
            sudo mv /var/www/back2earth.new /var/www/back2earth
            ls -l /var/www/back2earth'
          rm -f ~/.ssh/deploy_key

      - name: Check the site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://back2earth.pp.ua/)
          echo "https://back2earth.pp.ua/ -> $code"
          [ "$code" = 200 ]
